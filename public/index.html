<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover'>
<meta name='theme-color' content='#f2f2f7'>
<title>СКФУ</title>
<style>
  :root {
    --bg-base: #f2f2f7;
    --bg-grad-1: rgba(0, 122, 255, 0.10);
    --bg-grad-2: rgba(175, 82, 222, 0.08);
    --bg-grad-3: rgba(255, 149, 0, 0.06);
    --text: #000;
    --text-secondary: rgba(60, 60, 67, 0.6);
    --text-tertiary: rgba(60, 60, 67, 0.3);
    --accent: #007aff;
    --accent-hover: #0066d6;
    --green: #34c759;
    --red: #ff3b30;
    --orange: #ff9500;
    --purple: #af52de;
    --indigo: #5856d6;
    --yellow: #ffcc00;
    --glass-blur: 24px;
    --glass-sat: 1.8;
    --glass-border-light: rgba(255, 255, 255, 0.55);
    --glass-bg-light: rgba(255, 255, 255, 0.68);
    --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.45), inset 0 -1px 0 rgba(0, 0, 0, 0.03);
    --shadow-card: 0 1px 2px rgba(0,0,0,0.03), 0 12px 40px rgba(0,0,0,0.08);
    --shadow-float: 0 12px 40px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.06);
    --radius-card: 22px;
    --radius-pill: 100px;
    --gray-bg: rgba(120, 120, 128, 0.12);
    --separator: rgba(60, 60, 67, 0.10);
    --separator-opaque: rgba(60, 60, 67, 0.22);
    --tab-accent: var(--accent);
    --tab-accent-home: #007aff;
    --tab-accent-journal: #34c759;
    --tab-accent-events: #ff9500;
    --tab-accent-starostas: #5856d6;
    --tab-accent-services: #ff2d55;
    --tab-accent-settings: #8e8e93;
  }
  html[data-theme='dark'] {
    --bg-base: #000;
    --bg-grad-1: rgba(10, 132, 255, 0.16);
    --bg-grad-2: rgba(191, 90, 242, 0.12);
    --bg-grad-3: rgba(255, 159, 10, 0.08);
    --text: #fff;
    --text-secondary: rgba(235, 235, 245, 0.6);
    --text-tertiary: rgba(235, 235, 245, 0.3);
    --accent: #0a84ff;
    --accent-hover: #409cff;
    --green: #30d158;
    --red: #ff453a;
    --orange: #ff9f0a;
    --purple: #bf5af2;
    --indigo: #5e5ce6;
    --yellow: #ffd60a;
    --glass-border-light: rgba(255, 255, 255, 0.14);
    --glass-bg-light: rgba(28, 28, 30, 0.62);
    --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 -1px 0 rgba(255, 255, 255, 0.02);
    --shadow-card: 0 1px 2px rgba(0,0,0,0.4), 0 12px 40px rgba(0,0,0,0.5);
    --shadow-float: 0 12px 40px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.3);
    --gray-bg: rgba(120, 120, 128, 0.24);
    --separator: rgba(84, 84, 88, 0.34);
    --separator-opaque: rgba(84, 84, 88, 0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg-base); color: var(--text);
    min-height: 100vh; font-size: 16px; line-height: 1.4;
    letter-spacing: -0.022em; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: -20%;
    background:
      radial-gradient(circle at 20% 15%, var(--bg-grad-1) 0%, transparent 45%),
      radial-gradient(circle at 80% 25%, var(--bg-grad-2) 0%, transparent 45%),
      radial-gradient(circle at 50% 85%, var(--bg-grad-3) 0%, transparent 50%),
      radial-gradient(circle at 90% 90%, var(--bg-grad-1) 0%, transparent 40%);
    z-index: -1; pointer-events: none;
    animation: bgFloat 24s ease-in-out infinite;
  }
  @keyframes bgFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(3%, -2%) scale(1.05); }
    66% { transform: translate(-2%, 3%) scale(1.02); }
  }
  .hidden { display: none !important; }
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .login-card {
    background: var(--glass-bg-light);
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
    border: 1px solid var(--glass-border-light);
    box-shadow: var(--glass-highlight), var(--shadow-float);
    padding: 44px 30px; border-radius: 32px;
    width: 100%; max-width: 400px;
    animation: appear 0.6s cubic-bezier(0.16, 1, 0.3, 1); text-align: center;
  }
  @keyframes appear { from { opacity: 0; transform: translateY(30px) scale(0.94); } to { opacity: 1; transform: none; } }
  .login-card .logo {
    width: 78px; height: 78px; border-radius: 22px;
    background: linear-gradient(160deg, #0a84ff 0%, #5e5ce6 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; margin: 0 auto 22px;
    box-shadow: 0 16px 40px rgba(10, 132, 255, 0.35);
  }
  .login-card h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px; }
  .login-card .subtitle { color: var(--text-secondary); margin-bottom: 28px; font-size: 15px; }
  .login-card input {
    width: 100%; padding: 16px 18px; border: 1px solid transparent;
    background: var(--gray-bg); border-radius: 14px;
    font-size: 16px; font-family: inherit;
    margin-bottom: 10px; transition: all 0.2s ease;
    color: var(--text); text-align: left;
  }
  .login-card input:focus {
    outline: none; background: var(--glass-bg-light);
    border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.18);
  }
  .login-card input::placeholder { color: var(--text-tertiary); }
  .login-card #login-btn {
    width: 100%; padding: 16px; background: var(--accent); color: #fff;
    border: none; border-radius: 14px; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: all 0.2s ease; margin-top: 12px;
    font-family: inherit; box-shadow: 0 8px 24px rgba(0, 122, 255, 0.35);
  }
  .login-card #login-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .login-card #login-btn:disabled { background: #c7c7cc; cursor: wait; box-shadow: none; }
  .login-hint { margin-top: 24px; font-size: 12px; color: var(--text-tertiary); line-height: 2; }
  .login-hint code {
    background: var(--gray-bg); padding: 3px 9px; border-radius: 7px;
    font-size: 12px; font-family: 'SF Mono', Monaco, monospace; color: var(--text-secondary);
  }
  .error-msg {
    background: rgba(255, 59, 48, 0.12); color: var(--red); padding: 12px 14px;
    border-radius: 14px; font-size: 13px; margin-bottom: 12px; font-weight: 500;
  }
  #app-screen { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 120px; max-width: 1200px; margin: 0 auto; width: 100%; }
  .header {
    position: sticky; top: 14px; z-index: 100; margin: 14px 16px 0;
    background: var(--glass-bg-light);
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
    border: 1px solid var(--glass-border-light);
    box-shadow: var(--glass-highlight), var(--shadow-card);
    border-radius: var(--radius-pill); padding: 10px 16px 10px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header .brand { font-weight: 700; font-size: 15px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
  .header .brand .dot {
    width: 30px; height: 30px; border-radius: 10px;
    background: linear-gradient(160deg, #0a84ff 0%, #5e5ce6 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #fff; box-shadow: 0 4px 12px rgba(10, 132, 255, 0.35);
  }
  .header .user-info { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .header .user-info .group {
  background: rgba(0, 122, 255, 0.12);
  color: var(--accent);
  padding: 8px 15px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.2;
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  box-sizing: border-box;
  }
  .header .user-info button {
    background: var(--gray-bg); color: var(--text); border: none;
    padding: 8px 15px; border-radius: 100px; cursor: pointer;
    font-size: 13px; font-weight: 500; font-family: inherit;
    min-height: 32px; box-sizing: border-box;
    display: inline-flex; align-items: center;
  }
  .header .user-info .icon-btn {
    background: var(--gray-bg);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    padding: 0;
    transition: background 0.2s;
  }
  .header .user-info .icon-btn:hover {
    background: rgba(120, 120, 128, 0.2);
  }
  .header .user-info .icon-btn .icon-svg {
    width: 20px;
    height: 20px;
    stroke-width: 2;
  }
  .page-title {
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: sticky; top: 78px; z-index: 50; padding: 32px 24px 12px;
    background: linear-gradient(180deg, var(--bg-base) 0%, var(--bg-base) 70%, transparent 100%);
    pointer-events: none;
  }
  .page-title h1 { font-size: 40px; color: var(--tab-accent); transition: font-size 0.35s cubic-bezier(0.16, 1, 0.3, 1), color 0.35s ease; line-height: 1.15; }
  .page-title p { color: var(--text-secondary); font-size: 15px; margin-top: 4px; transition: opacity 0.3s ease, max-height 0.3s ease; overflow: hidden; max-height: 30px; }
  body.scrolled .page-title { padding: 12px 24px 8px; }
  body.scrolled .page-title h1 { font-size: 22px; }
  body.scrolled .page-title p { opacity: 0; max-height: 0; }
  main { padding: 0 16px; flex: 1; }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .group {
    background: var(--glass-bg-light);
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
    border: 1px solid var(--glass-border-light);
    box-shadow: var(--glass-highlight), var(--shadow-card);
    border-radius: var(--radius-card);
    margin-bottom: 20px; overflow: hidden;
    animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .group:nth-child(1) { animation-delay: 0s; }
  .group:nth-child(2) { animation-delay: 0.06s; }
  .group:nth-child(3) { animation-delay: 0.12s; }
  .group:nth-child(4) { animation-delay: 0.18s; }
  .group:nth-child(5) { animation-delay: 0.24s; }
  .group:nth-child(6) { animation-delay: 0.3s; }
  .group-header { padding: 16px 20px 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .group-header .badge { padding: 4px 11px; border-radius: 100px; font-size: 11px; font-weight: 600; letter-spacing: 0.01em; text-transform: none; }
  .badge-readonly { background: rgba(88, 86, 214, 0.14); color: var(--indigo); }
  .badge-editable { background: rgba(52, 199, 89, 0.14); color: var(--green); }
  .badge-important { background: rgba(255, 59, 48, 0.14); color: var(--red); }
  .group-body { padding: 8px 0; }
  .row { display: flex; align-items: center; padding: 14px 20px; gap: 12px; transition: background 0.15s ease; }
  .row + .row { border-top: 1px solid var(--separator); }
  .row.clickable { cursor: pointer; }
  .row.clickable:hover { background: rgba(120, 120, 128, 0.06); }
  .row.clickable:active { background: rgba(120, 120, 128, 0.12); }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(160deg, #0a84ff, #5e5ce6);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; flex-shrink: 0;
    letter-spacing: -0.02em; overflow: hidden;
    box-shadow: 0 4px 12px rgba(10, 132, 255, 0.25);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.sm { width: 34px; height: 34px; font-size: 12px; }
  .avatar.lg { width: 100px; height: 100px; font-size: 34px; border-radius: 28px; }
  .row .idx { width: 30px; height: 30px; border-radius: 50%; background: var(--gray-bg); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .row .name { flex: 1; font-weight: 500; font-size: 15px; }
  .row .zach { font-size: 13px; color: var(--text-secondary); font-family: 'SF Mono', Monaco, monospace; }
  .row .chevron { color: var(--text-tertiary); font-size: 20px; font-weight: 300; }

  .social-row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--separator); }
  .social-row:first-of-type { border-top: none; }
  .social-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .social-icon.sm { width: 32px; height: 32px; font-size: 15px; border-radius: 10px; }
  .social-info { flex: 1; min-width: 0; }
  .social-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; margin-bottom: 2px; }
  .social-value { font-size: 14px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .social-actions { display: flex; gap: 4px; }
  .social-btn { background: transparent; border: none; width: 32px; height: 32px; border-radius: 10px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; font-family: inherit; }
  .social-btn.danger { color: var(--red); }
  .social-row-compact { display: flex; align-items: center; gap: 10px; padding: 8px 0; }

  .journal-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--separator); gap: 12px; flex-wrap: wrap; }
  .journal-toolbar .range { font-size: 14px; color: var(--text-secondary); font-weight: 500; }
  .journal-toolbar .nav-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .journal-toolbar button { background: var(--gray-bg); border: none; padding: 9px 15px; border-radius: 100px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text); font-family: inherit; }
  .journal-toolbar button.primary { background: var(--accent); color: #fff; }
  .journal-wrapper { overflow-x: auto; max-width: 100%; }
  .journal { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 14px; user-select: none; }
  .journal th, .journal td { padding: 0; text-align: center; border-right: 1px solid var(--separator); border-bottom: 1px solid var(--separator); }
  .journal th:last-child, .journal td:last-child { border-right: none; }
  .journal tr:last-child td { border-bottom: none; }
  .journal thead th { background: #f2f2f7; position: sticky; top: 0; z-index: 2; }
  html[data-theme='dark'] .journal thead th { background: #1c1c1e; }
  .journal th.date-cell { padding: 8px 4px; min-width: 54px; font-weight: 600; }
  .journal th.date-cell .weekday { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; font-weight: 500; }
  .journal th.date-cell .day { font-size: 15px; color: var(--text); margin-top: 1px; }
  .journal th.date-cell.today .day { color: var(--accent); font-weight: 700; }
  .journal th.name-col, .journal td.name-col {
    text-align: left; padding: 12px 16px; min-width: 220px; max-width: 260px;
    position: sticky; left: 0;
    background: var(--glass-bg-light);
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
    z-index: 3; border-right: 1px solid var(--separator-opaque);
    font-size: 14px; font-weight: 500;
    box-shadow: 12px 0 16px -8px rgba(0, 0, 0, 0.12);
  }
  html[data-theme='dark'] .journal th.name-col, html[data-theme='dark'] .journal td.name-col {
    box-shadow: 12px 0 16px -8px rgba(0, 0, 0, 0.5);
  }
  .journal thead th.name-col { background: #f2f2f7; z-index: 4; padding: 10px 16px; font-size: 12px; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.06em; }
  html[data-theme='dark'] .journal thead th.name-col { background: #1c1c1e; }
  .journal tbody tr.self-row td { background: rgba(0, 122, 255, 0.07); }
  .journal tbody tr.self-row td.name-col { background: rgba(0, 122, 255, 0.12); }
  .journal td.name-col { cursor: pointer; }
  .journal tbody tr:hover td:not(.name-col):not(.readonly) { background: rgba(0, 122, 255, 0.05); }
  .journal td.att-cell { width: 54px; min-width: 54px; height: 46px; cursor: pointer; }
  .journal td.att-cell.today {
    background: rgba(0, 122, 255, 0.06);
  }
  .journal td.att-cell.readonly { cursor: default; }
  .journal td.att-cell .status-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 12px; font-weight: 700; color: #fff;
    animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .status-badge.absent { background: var(--red); }
  .status-badge.excused { background: var(--indigo); }
  .status-badge.drone { background: var(--orange); }
  .status-badge.grade-5 { background: var(--green); }
  .status-badge.grade-4 { background: var(--accent); }
  .status-badge.grade-3 { background: var(--orange); }
  .status-badge.grade-2 { background: var(--red); }

  .popover-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .popover {
    background: var(--glass-bg-light);
    backdrop-filter: blur(40px) saturate(2);
    -webkit-backdrop-filter: blur(40px) saturate(2);
    border: 1px solid var(--glass-border-light);
    box-shadow: var(--glass-highlight), 0 24px 80px rgba(0, 0, 0, 0.3);
    border-radius: 26px; padding: 8px;
    min-width: 280px; max-width: 440px;
    max-height: 90vh; overflow-y: auto;
  }
  .popover-header { padding: 14px 18px 12px; border-bottom: 1px solid var(--separator); margin-bottom: 6px; }
  .popover-header h3 { font-size: 16px; font-weight: 600; }
  .popover-header p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .popover-item { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-radius: 16px; cursor: pointer; font-size: 15px; font-weight: 500; }
  .popover-item:hover { background: rgba(120, 120, 128, 0.12); }
  .popover-item .icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .popover-item.absent .icon { background: var(--red); }
  .popover-item.excused .icon { background: var(--indigo); }
  .popover-item.drone .icon { background: var(--orange); }
  .popover-item.clear .icon { background: var(--text-tertiary); }
  .popover-item .label { flex: 1; }
  .popover-item .check { color: var(--accent); font-weight: 700; }

  .profile-hero { display: flex; flex-direction: column; align-items: center; padding: 34px 20px 26px; text-align: center; }
  .profile-hero h2 { font-size: 24px; font-weight: 700; margin-top: 16px; }
  .profile-hero .role { color: var(--text-secondary); font-size: 14px; margin-top: 2px; }
  .profile-hero .badges { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
  .profile-hero .badges .pill { background: rgba(0, 122, 255, 0.12); color: var(--accent); padding: 6px 13px; border-radius: 100px; font-size: 12px; font-weight: 600; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 16px 20px; }
  .stat-cell { background: var(--gray-bg); border-radius: 16px; padding: 14px 10px; text-align: center; }
  .stat-cell .num { font-size: 24px; font-weight: 700; }
  .stat-cell .lbl { font-size: 11px; color: var(--text-secondary); margin-top: 2px; text-transform: uppercase; }
  .stat-cell.red .num { color: var(--red); }
  .stat-cell.orange .num { color: var(--orange); }
  .stat-cell.indigo .num { color: var(--indigo); }

  .hero-card {
    background: linear-gradient(160deg, #0a84ff 0%, #5e5ce6 100%);
    border-radius: var(--radius-card);
    padding: 26px; color: #fff; margin-bottom: 20px;
    box-shadow: 0 20px 50px rgba(10, 132, 255, 0.4);
    position: relative; overflow: hidden;
  }
  .hero-card .lbl { font-size: 13px; opacity: 0.85; text-transform: uppercase; font-weight: 600; }
  .hero-card .big { font-size: 60px; font-weight: 700; line-height: 1; margin-top: 10px; }

function el(tag, attrs, children) {
  attrs = attrs || {};
  var node = document.createElement(tag);
  for (var k in attrs) {
    var v = attrs[k];
    if (k === 'onclick') node.onclick = v;
    else if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else node.setAttribute(k, v);
  }
  if (children) {
    if (!Array.isArray(children)) children = [children];
    children.forEach(function(c) { if (c == null) return; node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });

async function api(path, options) {
  options = options || {};
  var headers = {
    'Content-Type': 'application/json',
    'Cache-Control': 'no-cache',
    'Pragma': 'no-cache'
  };
  if (options.headers) { for (var k in options.headers) headers[k] = options.headers[k]; }
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  var res = await fetch(API + path, { method: options.method || 'GET', headers: headers, body: options.body });
  if (res.headers.get('content-type')?.includes('text/csv')) return res.blob();
  var text = await res.text();
  var data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e) { data = text; }
  if (!res.ok) throw new Error((data && data.error) || ('Ошибка ' + res.status));
  if (data === null && res.status === 304) {
    // Кэш отдал пустой ответ — делаем повторный запрос без кэша
    return api(path, Object.assign({}, options, { headers: Object.assign({}, headers, { 'Cache-Control': 'no-cache' }) }));
  }
  return data;
}

async function openTeacherJournal(groupCode, subject, month) {
  var overlay = openOverlay();
  var pop = overlay.querySelector('.popover');
  pop.style.minWidth = '90vw';
  pop.style.maxWidth = '900px';
  pop.innerHTML = '<div class="empty">Загрузка...</div>';

  try {
    var url = '/api/teacher/journal?group=' + encodeURIComponent(groupCode) + '&subject=' + encodeURIComponent(subject);
    if (month) url += '&month=' + encodeURIComponent(month);
    var data = await api(url);

    pop.innerHTML = '';
    pop.appendChild(el('div', { class: 'popover-header' }, [
      el('h3', { text: subject }),
      el('p', { text: 'Группа ' + groupCode + ' · ' + data.students.length + ' студентов' })
    ]));

    // Тулбар: переключение месяца + текущий месяц
    var months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    var [year, mon] = data.month.split('-').map(Number);
    var monthLabel = months[mon - 1] + ' ' + year;

    var toolbar = el('div', { class: 'journal-toolbar' });
    var leftGroup = el('div', { class: 'nav-buttons' });
    leftGroup.appendChild(el('button', { text: '‹', onclick: function() {
      // предыдущий доступный месяц
      var idx = data.availableMonths.indexOf(data.month);
      if (idx > 0) { overlay.remove(); openTeacherJournal(groupCode, subject, data.availableMonths[idx - 1]); }
    }}));
    leftGroup.appendChild(el('span', { class: 'range', text: monthLabel }));
    leftGroup.appendChild(el('button', { text: '›', onclick: function() {
      var idx = data.availableMonths.indexOf(data.month);
      if (idx >= 0 && idx < data.availableMonths.length - 1) { overlay.remove(); openTeacherJournal(groupCode, subject, data.availableMonths[idx + 1]); }
    }}));
    toolbar.appendChild(leftGroup);

    var rightGroup = el('div', { class: 'nav-buttons' });
    rightGroup.appendChild(el('button', { text: 'Текущий месяц', onclick: function() {
      overlay.remove(); openTeacherJournal(groupCode, subject, null);
    }}));
    toolbar.appendChild(rightGroup);
    pop.appendChild(toolbar);

    if (!data.dates.length) {
      pop.appendChild(el('div', { class: 'empty', text: 'В этом месяце нет пар по этому предмету' }));
      return;
    }

    var wrapper = el('div', { class: 'journal-wrapper' });
    var table = buildTeacherJournalTable(data, groupCode, subject, overlay);
    wrapper.appendChild(table);
    pop.appendChild(wrapper);

  } catch (e) {
    pop.innerHTML = '<div class="empty">' + escapeHtml(e.message) + '</div>';
  }
}

function buildTeacherJournalTable(data, groupCode, subject, overlay) {
  var today = new Date().toISOString().slice(0, 10);

  var theadRow = el('tr', {});
  theadRow.appendChild(el('th', { class: 'name-col', text: 'Студент' }));
  data.dates.forEach(function(d) {
    var isToday = d === today;
    var dd = new Date(d + 'T00:00:00');
    var weekdays = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
    theadRow.appendChild(el('th', { class: 'date-cell' + (isToday ? ' today' : '') }, [
      el('div', { class: 'weekday', text: weekdays[dd.getDay()] }),
      el('div', { class: 'day', text: d.slice(8, 10) + '.' + d.slice(5, 7) })
    ]));
  });

  var tbody = el('tbody', {});
  data.students.forEach(function(s) {
    var tr = el('tr', {});
    var nameCell = el('td', { class: 'name-col' });

    var colorMap = { none: 'var(--text)', yellow: '#ffcc00', orange: 'var(--orange)', red: 'var(--red)' };
    var nameColor = colorMap[s.colorLevel] || 'var(--text)';

    if (s.individualPlan) {
      nameCell.appendChild(el('span', { style: 'color: var(--accent); font-weight:700; margin-right: 6px;', text: '★' }));
    }
    nameCell.appendChild(el('span', { style: 'color: ' + nameColor + '; font-weight: 600;', text: s.fullName }));
    if (s.nCount > 0) {
      nameCell.appendChild(el('span', {
        style: 'font-size: 11px; margin-left: 6px; padding: 1px 6px; border-radius: 100px; background: ' + nameColor + '20; color: ' + nameColor + '; font-weight: 700;',
        text: s.nCount + 'Н'
      }));
    }
    tr.appendChild(nameCell);

    data.dates.forEach(function(d) {
      var mark = (data.marks[s.id] || {})[d] || '';
      var isToday = d === today;
      var td = el('td', { class: 'att-cell' + (isToday ? ' today' : '') });
      if (mark) {
        var cls = mark === 'Н' ? 'absent' : (mark === 'С' ? 'drone' : 'grade-' + mark);
        td.appendChild(el('span', { class: 'status-badge ' + cls, text: mark }));
      }
      td.addEventListener('click', function() {
        openMarkPicker(s.id, d, mark, groupCode, subject, overlay);
      });
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  return el('table', { class: 'journal' }, [el('thead', {}, [theadRow]), tbody]);
}

function openMarkPicker(studentId, date, currentMark, groupCode, subject, parentOverlay) {
  var overlay = openOverlay();
  var pop = overlay.querySelector('.popover');
  pop.innerHTML = '';
  pop.appendChild(el('div', { class: 'popover-header' }, [
    el('h3', { text: 'Отметка' }),
    el('p', { text: 'Дата: ' + date })
  ]));

  var options = [
    { key: 'Н', label: 'Не был', color: 'var(--red)' },
    { key: 'С', label: 'БПЛА', color: 'var(--orange)' },
    { key: '2', label: 'Оценка 2', color: 'var(--red)' },
    { key: '3', label: 'Оценка 3', color: 'var(--orange)' },
    { key: '4', label: 'Оценка 4', color: 'var(--accent)' },
    { key: '5', label: 'Оценка 5', color: 'var(--green)' }
  ];

  options.forEach(function(opt) {
    var item = el('div', { class: 'popover-item' }, [
      el('div', { class: 'icon', style: 'background: ' + opt.color + ';', text: opt.key }),
      el('div', { class: 'label', text: opt.label }),
      currentMark === opt.key ? el('div', { class: 'check', text: '✓' }) : null
    ]);
    item.addEventListener('click', async function() {
      try {
        await api('/api/teacher/journal/mark', {
          method: 'POST',
          body: JSON.stringify({ group: groupCode, subject: subject, studentId: studentId, date: date, mark: opt.key })
        });
        overlay.remove();
        parentOverlay.remove();
        openTeacherJournal(groupCode, subject, date.slice(0, 7));
      } catch (e) { toast(e.message, true); }
    });
    pop.appendChild(item);
  });

  if (currentMark) {
    var clear = el('div', { class: 'popover-item clear' }, [
      el('div', { class: 'icon', text: '×' }),
      el('div', { class: 'label', text: 'Убрать отметку' })
    ]);
    clear.addEventListener('click', async function() {
      try {
        await api('/api/teacher/journal/mark', {
          method: 'POST',
          body: JSON.stringify({ group: groupCode, subject: subject, studentId: studentId, date: date, mark: null })
        });
        overlay.remove();
        parentOverlay.remove();
        openTeacherJournal(groupCode, subject, date.slice(0, 7));
      } catch (e) { toast(e.message, true); }
    });
    pop.appendChild(clear);
  }
}

async function renderSchedule() {
  main.innerHTML = '';
  var offset = state.scheduleOffset || 0;
  var groupCode = state.viewingGroup || state.user.group;
  var isOwnGroup = groupCode === state.user.group;

  var data;
  try {
    data = await api('/api/groups/' + encodeURIComponent(groupCode) + '/schedule?offset=' + offset);
  } catch (err) {
    // Расписания нет — показываем сообщение + кнопку назад
    var errGroup = el('div', { class: 'group' });
    errGroup.appendChild(el('div', { class: 'group-header' }, [groupCode]));
    errGroup.appendChild(el('div', { class: 'empty', text: 'Расписание для этой группы пока не добавлено' }));
    if (!isOwnGroup) {
      errGroup.appendChild(el('div', { style: 'padding: 0 20px 16px;' }, [
        el('button', { class: 'btn btn-secondary', style: 'width: 100%;', text: '← Вернуться к своей группе', onclick: function() {
          state.viewingGroup = null;
          state.scheduleOffset = 0;
          renderSchedule();
        }})
      ]));
    }
    main.appendChild(errGroup);
    return;
  }
  var weekdays = { mon: 'Понедельник', tue: 'Вторник', wed: 'Среда', thu: 'Четверг', fri: 'Пятница', sat: 'Суббота' };
  var months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var startD = new Date(data.weekStartDate + 'T00:00:00');
  var endD = new Date(data.weekEndDate + 'T00:00:00');
  var weekLabel = startD.getMonth() === endD.getMonth()
    ? startD.getDate() + ' – ' + endD.getDate() + ' ' + months[startD.getMonth()] + ' ' + startD.getFullYear()
    : startD.getDate() + ' ' + months[startD.getMonth()] + ' – ' + endD.getDate() + ' ' + months[endD.getMonth()] + ' ' + endD.getFullYear();

  var topGroup = el('div', { class: 'group' });
  topGroup.appendChild(el('div', { class: 'schedule-top-bar' }, [
    el('div', { class: 'schedule-top-info' }, [
      el('div', { class: 'schedule-group-code', text: groupCode }),
      isOwnGroup
        ? el('div', { class: 'schedule-group-label', text: 'моя группа' })
        : el('button', { class: 'schedule-group-back', text: '← вернуться к своей', onclick: function() {
            state.viewingGroup = null; state.scheduleOffset = 0; renderSchedule();
          }})
    ]),
    el('button', {
      class: 'schedule-search-btn',
      html: '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
      onclick: openGroupPicker
    })
  ]));
  main.appendChild(topGroup);

  var headGroup = el('div', { class: 'group' });
  var navRow = el('div', { class: 'schedule-week-header' });
  navRow.appendChild(el('button', { class: 'schedule-arrow', text: '‹', onclick: function() {
    state.scheduleOffset = (state.scheduleOffset || 0) - 1; renderSchedule();
  }}));
  var weekBtn = el('button', { class: 'schedule-week-btn' }, [
    el('div', { class: 'schedule-week-btn-dates', text: weekLabel }),
    el('div', { class: 'schedule-week-btn-meta' }, [
      el('span', { class: 'badge ' + (data.weekNumber === 1 ? 'badge-editable' : 'badge-readonly'), text: data.weekNumber === 1 ? 'Числитель' : 'Знаменатель' }),
      offset === 0 ? el('span', { class: 'schedule-current-marker', text: '• текущая' }) : null,
      el('span', { class: 'schedule-week-chevron', text: '▾' })
    ])
  ]);
  weekBtn.addEventListener('click', function() { openWeeksPickerForGroup(groupCode); });
  navRow.appendChild(weekBtn);
  navRow.appendChild(el('button', { class: 'schedule-arrow', text: '›', onclick: function() {
    state.scheduleOffset = (state.scheduleOffset || 0) + 1; renderSchedule();
  }}));
  headGroup.appendChild(navRow);
  main.appendChild(headGroup);

  var todayDow = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'][new Date().getDay()];
  var hasAny = false;

  ['mon', 'tue', 'wed', 'thu', 'fri', 'sat'].forEach(function(dayKey) {
    var day = data.days.find(function(d) { return d.day === dayKey; });
    if (!day || !day.lessons || !day.lessons.length) return;
    hasAny = true;
    var dowIndex = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat'].indexOf(dayKey);
    var dayDate = new Date(startD);
    dayDate.setDate(dayDate.getDate() + dowIndex);
    var isToday = offset === 0 && dayKey === todayDow;
    var dayGroup = el('div', { class: 'group' });
    dayGroup.appendChild(el('div', { class: 'group-header' }, [
      weekdays[dayKey] + ' · ' + dayDate.getDate() + ' ' + months[dayDate.getMonth()],

    ]));
    day.lessons.forEach(function(l) {
      var parts = l.time.split('–');
      var roomText = l.room || '';
      var buildingText = '';
      var m = String(l.room || '').match(/^(\d+)[-–—](.+)$/);
      if (m) { buildingText = 'Корпус ' + m[1]; roomText = 'ауд. ' + m[2]; }
      var teacherNode = null;
      if (l.teacher) {
        teacherNode = el('button', { class: 'schedule-teacher-btn', text: l.teacher, onclick: (function(teacherName) {
          return function() { openTeacherScheduleByName(teacherName); };
        })(l.teacher) });
      }
      dayGroup.appendChild(el('div', { class: 'schedule-row' }, [
        el('div', { class: 'schedule-time' }, [el('div', { class: 'schedule-time-main', text: parts[0] }), el('div', { class: 'schedule-time-sub', text: parts[1] || '' })]),
        el('div', { class: 'schedule-info' }, [
          el('div', { class: 'schedule-subject', text: l.subject }),
          el('div', { class: 'schedule-meta' }, [el('span', { text: l.type }), teacherNode ? el('span', { text: ' · ' }) : null, teacherNode]),
          el('div', { class: 'schedule-location' }, [
            el('span', { class: 'schedule-room', text: roomText }),
            buildingText ? el('span', { class: 'schedule-building', text: buildingText }) : null
          ])
        ])
      ]));
    });
    main.appendChild(dayGroup);
  });
  if (!hasAny) main.appendChild(el('div', { class: 'group' }, [el('div', { class: 'empty', text: 'На этой неделе пар нет' })]));
}

function renderWeeksList(data, overlay) {
  var pop = overlay.querySelector('.popover');
  var months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  pop.innerHTML = '';
  pop.appendChild(el('div', { class: 'popover-header' }, [el('h3', { text: 'Выбор недели' }), el('p', { text: 'Всего ' + data.weeks.length + ' недель' })]));
  var list = el('div', { class: 'weeks-list' });
  data.weeks.forEach(function(w) {
    var startD = new Date(w.weekStart + 'T00:00:00');
    var endD = new Date(w.weekEnd + 'T00:00:00');
    var label = startD.getDate() + ' ' + months[startD.getMonth()] + ' – ' + endD.getDate() + ' ' + months[endD.getMonth()];
    var item = el('div', { class: 'week-item' + (w.isCurrent ? ' current' : '') }, [
      el('div', { class: 'week-item-dates', text: label }),
      el('div', { class: 'week-item-meta' }, [
        w.weekNumber ? el('span', { class: 'week-item-badge ' + (w.weekNumber === 1 ? 'num1' : 'num2'), text: w.weekNumber === 1 ? 'Числ.' : 'Знам.' }) : null,
        w.isCurrent ? el('span', { class: 'week-item-current', text: 'текущая' }) : null
      ])
    ]);
    item.addEventListener('click', function() {
      state.scheduleOffset = w.offset;
      overlay.remove();
      if (state.viewingTeacher) renderTeacherSchedule();
      else renderSchedule();
    });
    list.appendChild(item);
  });
  pop.appendChild(list);
}

async function openTeacherScheduleByName(teacherName) {
  var allTeachers = await api('/api/teachers');
  var parts = teacherName.split(' ');
  var found = allTeachers.find(function(t) {
    var tParts = t.fullName.split(' ');
    if (tParts[0] !== parts[0]) return false;
    if (parts[1] && tParts[1] && tParts[1][0] !== parts[1][0]) return false;
    return true;
  });
  if (!found) { toast('Преподаватель не найден в базе', true); return; }
  state.viewingTeacher = found.id;
  state.viewingTeacherName = found.fullName;
  state.teacherScheduleOffset = 0;
  switchTab('teacher-schedule');
}

async function openGroupPicker() {

  var pop = overlay.querySelector('.popover');
  pop.innerHTML = '<div class="empty">Загрузка...</div>';
  try {

function buildDonutSVG(stats, size) {
  size = size || 200;
  var radius = size / 2 - 12;
  var stroke = 18;
  var center = size / 2;
  var circumference = 2 * Math.PI * radius;
  var values = [
    { value: stats.excused || 0, color: '#5856d6' },
    { value: stats.drone || 0, color: '#ff9500' },
    { value: stats.absent || 0, color: '#ff3b30' }
  ];
  var total = values.reduce(function(s,v) { return s + v.value; }, 0);
  var parts = ['<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">'];
  parts.push('<circle cx="' + center + '" cy="' + center + '" r="' + radius + '" fill="none" stroke="rgba(120,120,128,0.15)" stroke-width="' + stroke + '"/>');
  var offset = 0;
  if (total > 0) {
    values.forEach(function(v) {
      if (v.value === 0) return;
      var dash = (v.value / total) * circumference;
      parts.push('<circle cx="' + center + '" cy="' + center + '" r="' + radius + '" fill="none" stroke="' + v.color + '" stroke-width="' + stroke + '" stroke-dasharray="' + dash + ' ' + (circumference - dash) + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + center + ' ' + center + ')"/>');
      offset += dash;
    });
  }
  var percent = stats.percent || (total ? Math.round(((stats.excused + stats.drone) / total) * 100) : 0);
  parts.push('<text x="' + center + '" y="' + (center + 4) + '" text-anchor="middle" font-size="34" font-weight="700" fill="currentColor">' + percent + '%</text>');
  parts.push('<text x="' + center + '" y="' + (center + 24) + '" text-anchor="middle" font-size="11" fill="rgba(120,120,128,0.8)">посещаемость</text>');
  parts.push('</svg>');
  return parts.join('');
}

function buildAbsenceCard(a) {
  var statusColor = a.status === 'absent' ? 'var(--red)' : 'var(--orange)';
  var statusLabel = a.status === 'absent' ? 'Не был' : 'БПЛА';
  var countLabel = a.lessonsCount ? ' · ' + a.lessonsCount + ' ' + plural(a.lessonsCount, 'пара', 'пары', 'пар') : '';
  var card = el('div', { class: 'absence-card' });
  card.appendChild(el('div', { class: 'absence-header' }, [
    el('div', { class: 'absence-date-block' }, [
      el('div', { class: 'absence-date', text: formatDate(a.date) }),
      el('div', { class: 'absence-weekday', text: a.weekday || '' })
    ]),
    el('div', { class: 'absence-status', style: 'color:' + statusColor + ';', text: statusLabel + countLabel })
  ]));
  if (a.lessons && a.lessons.length) {
    var lessonsWrap = el('div', { class: 'absence-lessons' });
    a.lessons.forEach(function(l) {
      var parts = (l.time || '').split('–');
      var roomText = l.room || '';
      var m = String(l.room || '').match(/^(\d+)[-–—](.+)$/);
      if (m) roomText = 'Корпус ' + m[1] + ' · ауд. ' + m[2];
      lessonsWrap.appendChild(el('div', { class: 'absence-lesson' }, [
        el('div', { class: 'absence-lesson-time' }, [
          el('div', { class: 'absence-lesson-time-main', text: parts[0] || '' }),
          el('div', { class: 'absence-lesson-time-sub', text: parts[1] || '' })
        ]),
        el('div', { class: 'absence-lesson-info' }, [
          el('div', { class: 'absence-lesson-subject', text: l.subject }),
          el('div', { class: 'absence-lesson-meta', text: (l.type || '') + (l.teacher ? ' · ' + l.teacher : '') }),
          roomText ? el('div', { class: 'absence-lesson-room', text: roomText }) : null
        ])
      ]));
    });
    card.appendChild(lessonsWrap);
  } else {
    card.appendChild(el('div', { class: 'absence-no-lessons', text: 'Расписание на этот день не найдено' }));
  }
  return card;
}
function plural(n, one, few, many) {
  var mod10 = n % 10;
  var mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
  return many;
}

function buildJournalTable(students, dates) {

  theadRow.appendChild(el('th', { class: 'name-col', text: 'Студент' }));
  dates.forEach(function(d) {
    var isToday = isSameDay(d, today);
    theadRow.appendChild(el('th', { class: 'date-cell' + (isToday ? ' today' : '') }, [
      el('div', { class: 'weekday', text: weekdays[d.getDay()] }),
      el('div', { class: 'day', text: String(d.getDate()) })
    ]));
  });
  var tbody = el('tbody', {});
  students.forEach(function(s) {
    var tr = el('tr', {});
    var nameCell = el('td', { class: 'name-col', text: s.fullName });
    if (s.userId) nameCell.addEventListener('click', function() { openUserProfile(s.userId); });
    tr.appendChild(nameCell);
    dates.forEach(function(d) {
      var iso = fmtISO(d);
      var status = s.attendance && s.attendance[iso];
      var td = el('td', { class: 'att-cell' });
      if (status) {
        var labels = { absent: 'Н', excused: 'У', drone: 'С' };

  return el('table', { class: 'journal' }, [el('thead', {}, [theadRow]), tbody]);

function openAttendancePopover(studentId, date, currentStatus) {
  var students = window._workingData?.students || [];

  if (!student) return;
  var overlay = openOverlay();
  var popover = overlay.querySelector('.popover');
  var d = new Date(date + 'T00:00:00');
  var months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  popover.appendChild(el('div', { class: 'popover-header' }, [el('h3', { text: student.fullName }), el('p', { text: d.getDate() + ' ' + months[d.getMonth()] })]));
  [
    { key: 'absent', label: 'Не был', icon: 'Н' },
    { key: 'excused', label: 'Уважительная', icon: 'У' },
    { key: 'drone', label: 'Беспилотная опасность', icon: 'С' }

      el('div', { class: 'label', text: opt.label })

    if (currentStatus === opt.key) item.appendChild(el('div', { class: 'check', text: '✓' }));
    item.addEventListener('click', async function() { overlay.remove(); await setAttendance(studentId, date, opt.key); });
    popover.appendChild(item);
  });
  if (currentStatus) {
    var clearItem = el('div', { class: 'popover-item clear' }, [el('div', { class: 'icon', text: '×' }), el('div', { class: 'label', text: 'Убрать отметку' })]);
    clearItem.addEventListener('click', async function() { overlay.remove(); await clearAttendance(studentId, date); });

async function setAttendance(studentId, date, status) {
  try {
    var updated = await api('/api/groups/' + encodeURIComponent(state.user.group) + '/working/' + studentId + '/attendance', { method:'POST', body: JSON.stringify({ date, status }) });
    var list = window._workingData;
    var idx = list.students.findIndex(function(s) { return s.id === studentId; });
    if (idx >= 0) list.students[idx] = updated;
    renderWorking();
    toast('Отмечено');
  } catch(e) { toast(e.message, true); }
}
async function clearAttendance(studentId, date) {
  try {
    var updated = await api('/api/groups/' + encodeURIComponent(state.user.group) + '/working/' + studentId + '/attendance/' + date, { method:'DELETE' });
    var list = window._workingData;
    var idx = list.students.findIndex(function(s) { return s.id === studentId; });
    if (idx >= 0) list.students[idx] = updated;
    renderWorking();
    toast('Убрано');
  } catch(e) { toast(e.message, true); }
}

function buildGradebookRow(item, kind) {
  var row = el('div', { class: 'gb-row' });
  var left = el('div', { class: 'gb-row-left' });
  left.appendChild(el('div', { class: 'gb-row-subject', text: item.subject || item.name || '—' }));
  var meta = [];
  if (kind === 'practice' && item.type) meta.push(item.type);
  if (item.teacher) meta.push(item.teacher);
  if (item.hours) meta.push(item.hours + ' ч.');
  if (meta.length) left.appendChild(el('div', { class: 'gb-row-meta', text: meta.join(' · ') }));
  if (item.date) left.appendChild(el('div', { class: 'gb-row-date', text: formatDate(item.date) }));
  row.appendChild(left);
  var gradeText = item.grade || '—';
  var gradeClass = 'gb-grade';
  if (gradeText === 'отлично' || gradeText === '5') gradeClass += ' grade-5';
  else if (gradeText === 'хорошо' || gradeText === '4') gradeClass += ' grade-4';
  else if (gradeText === 'удовлетворительно' || gradeText === '3') gradeClass += ' grade-3';
  else if (gradeText === 'неудовлетворительно' || gradeText === '2') gradeClass += ' grade-2';
  else if (gradeText === 'зачтено') gradeClass += ' grade-pass';
  else if (gradeText === 'не зачтено') gradeClass += ' grade-fail';
  row.appendChild(el('div', { class: gradeClass, text: gradeText }));
  return row;
}

            el('span', { text: s.fullName })
          ]),
          el('div', { class: 'zach', text: s.zachetka || '' }),
          el('div', { class: 'chevron', text: '›' })
        ]);
        body.appendChild(row);
      });
    }
    groupBlock.appendChild(body);
    main.appendChild(groupBlock);
  });
}

async function renderCuratorStudentDetail() {
  main.innerHTML = '';
  var studentId = state.curatorStudentId;
  if (!studentId) { switchTab('curator-students'); return; }

  var data = await api('/api/curator/student/' + studentId + '/summary');

  // Hero
  var hero = el('div', { class: 'hero-card' }, [
    el('div', { class: 'lbl', text: 'Студент' }),
    el('div', { class: 'big', html: data.stats.percent + '<span>%</span>', style: 'font-size: 48px;' }),
    el('div', { class: 'sub', text: data.fullName + ' · ' + data.group + (data.individualPlan ? ' · ⭐ ИП' : '') }),
    el('div', { class: 'row-stats' }, [
      el('div', { class: 'stat' }, [el('div', { class: 'num', text: String(data.stats.attended) }), el('div', { class: 'lbl2', text: 'был' })]),
      el('div', { class: 'stat' }, [el('div', { class: 'num', text: String(data.stats.absent) }), el('div', { class: 'lbl2', text: 'Н' })]),
      el('div', { class: 'stat' }, [el('div', { class: 'num', text: String(data.stats.excused) }), el('div', { class: 'lbl2', text: 'С' })]),
      el('div', { class: 'stat' }, [el('div', { class: 'num', text: data.stats.avgGrade || '—' }), el('div', { class: 'lbl2', text: 'ср. балл' })])
    ])
  ]);
  main.appendChild(hero);

  // Список предметов
  var group = el('div', { class: 'group' });
  group.appendChild(el('div', { class: 'group-header', text: 'Предметы (' + data.subjects.length + ')' }));

  if (!data.subjects.length) {
    group.appendChild(el('div', { class: 'empty', text: 'Пока нет отметок' }));
  } else {
    data.subjects.forEach(function(subj) {
      var gradesStr = subj.grades.length ? subj.grades.join(', ') : '—';
      group.appendChild(el('div', { class: 'row' }, [
        el('div', { style: 'flex: 1; min-width: 0;' }, [
          el('div', { style: 'font-weight: 600; font-size: 14px;', text: subj.subject }),
          el('div', { style: 'font-size: 12px; color: var(--text-secondary); margin-top: 2px;', text: 'Оценки: ' + gradesStr })
        ]),
        el('div', { style: 'display: flex; gap: 6px; flex-shrink: 0;' }, [
          subj.n > 0 ? el('span', { style: 'font-size: 11px; padding: 2px 8px; border-radius: 100px; background: rgba(255,59,48,0.15); color: var(--red); font-weight: 700;', text: subj.n + ' Н' }) : null,
          subj.s > 0 ? el('span', { style: 'font-size: 11px; padding: 2px 8px; border-radius: 100px; background: rgba(255,149,0,0.15); color: var(--orange); font-weight: 700;', text: subj.s + ' С' }) : null
        ])
      ]));
    });
  }
  main.appendChild(group);

  var back = el('div', { class: 'group' });
  back.appendChild(el('div', { class: 'row clickable', onclick: function() { switchTab('curator-students'); } }, [
    el('div', { class: 'name', style: 'color: var(--accent); text-align: center; width: 100%;', text: '← К списку студентов' })
  ]));
  main.appendChild(back);
}

async function renderSettings() {
  main.innerHTML = '';
  var currentTheme = localStorage.getItem('theme') || 'system';
  var langGroup = el('div', { class: 'group' });
  langGroup.appendChild(el('div', { class: 'group-header', text: t('language') }));
  [
    { key: 'ru', label: '🇷🇺 Русский' },
    { key: 'en', label: '🇬🇧 English' },
    { key: 'de', label: '🇩🇪 Deutsch' }
  ].forEach(function(l) {
    var isActive = LANG === l.key;
    var item = el('div', { class: 'row clickable', onclick: function() { localStorage.setItem('lang', l.key); location.reload(); }}, [
      el('div', { class: 'name', text: l.label }),
      isActive ? el('div', { style: 'color:var(--accent); font-weight:700;', text: '✓' }) : null
    ]);
    langGroup.appendChild(item);
  });
  main.appendChild(langGroup);
  var appearance = el('div', { class: 'group' });
  appearance.appendChild(el('div', { class: 'group-header', text: 'Оформление' }));
  [
    { key: 'system', label: 'Как в системе', icon: '⚙️' },
    { key: 'light', label: 'Светлая', icon: '☀️' },
    { key: 'dark', label: 'Тёмная', icon: '🌙' }
  ].forEach(function(th) {
    var isActive = currentTheme === th.key;
    var item = el('div', { class: 'row clickable' }, [
      el('div', { class: 'idx', style: 'background: transparent; font-size: 18px;', text: th.icon }),
      el('div', { class: 'name', text: th.label }),
      isActive ? el('div', { style: 'color: var(--accent); font-weight:700;', text: '✓' }) : null
    ]);
    item.addEventListener('click', function() { localStorage.setItem('theme', th.key); applyTheme(th.key); renderSettings(); });
    appearance.appendChild(item);
  });
  main.appendChild(appearance);
  if (state.user.role === 'student' || state.user.role === 'starosta') {
    var pg = el('div', { class: 'group' });
    pg.appendChild(el('div', { class: 'group-header', text: 'Профиль' }));
    pg.appendChild(el('div', { class: 'row clickable', onclick: function() { renderProfileSelfIntoMain(); } }, [
      avatarNode(state.user, 'sm'),
      el('div', { class: 'name', text: 'Мой профиль' }),
      el('div', { class: 'chevron', text: '›' })
    ]));
    main.appendChild(pg);
  }
  var about = el('div', { class: 'group' });
  about.appendChild(el('div', { class: 'group-header', text: 'О приложении' }));
  about.appendChild(el('div', { class: 'row' }, [el('div', { class: 'name', text: 'Версия' }), el('div', { style: 'color:var(--text-secondary);', text: '1.0.0' })]));
  about.appendChild(el('div', { class: 'row' }, [el('div', { class: 'name', text: 'Разработчик' }), el('div', { style: 'color:var(--text-secondary);', text: 'СКФУ' })]));
  main.appendChild(about);
  var lg = el('div', { class: 'group' });
  var lr = el('div', { class: 'row clickable' }, [el('div', { class: 'name', style: 'color: var(--red); text-align:center; width:100%;', text: 'Выйти из аккаунта' })]);
  lr.addEventListener('click', logout);
  lg.appendChild(lr);
  main.appendChild(lg);
}
function renderProfileSelfIntoMain() {
  state.currentTab = 'profile';
  document.getElementById('page-title-text').textContent = 'Профиль';
  document.getElementById('page-subtitle').textContent = 'Мои данные';
  renderProfileSelf();
}
function applyTheme(theme) {
  var root = document.documentElement;
  var isDark = false;
  if (theme === 'system') {
    root.removeAttribute('data-theme');
    isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (isDark) root.setAttribute('data-theme', 'dark');
  } else {
    root.setAttribute('data-theme', theme);
    isDark = theme === 'dark';
  }
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
  var stored = localStorage.getItem('theme') || 'system';
  if (stored === 'system') applyTheme('system');
});

async function enterApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  buildTabBar();
  var tabs = getTabs();
  switchTab(tabs[0].key);
  if (state.user.role === 'teacher' || state.user.role === 'curator') {
    document.getElementById('inbox-btn').classList.remove('hidden');
  }
}

document.getElementById('login-btn').addEventListener('click', function() {
  var login = document.getElementById('login-input').value.trim();
  var password = document.getElementById('password-input').value;
  if (!login || !password) { toast('Введите логин и пароль', true); return; }
  tryLogin(login, password);
});
document.getElementById('password-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('login-btn').click(); });
document.getElementById('logout-btn').addEventListener('click', logout);
document.getElementById('inbox-btn').addEventListener('click', function() {
  state.currentTab = 'inbox';
  document.getElementById('page-title-text').textContent = 'Входящие';
  document.getElementById('page-subtitle').textContent = '';
  renderCurrentTab();
});
window.addEventListener('scroll', function() { document.body.classList.toggle('scrolled', window.scrollY > 60); }, { passive: true });
applyTheme(localStorage.getItem('theme') || 'system');
(async function init() {
  var ok = await checkAuth();
  if (ok) await enterApp();
})();
</script>
